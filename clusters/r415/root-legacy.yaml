# r415 root-legacy.yaml: the CI v4 P5.2 cut-over rollback file (plans/cicd/proposal-v4.md P5.0/P5.2).
# The pre-cutover root exactly as live before the cut-over: staging-20261124.9 (gitops bd11f03, verified), rendered
# by scripts/staging-root.sh --context r415 on 2026-11-24 (kubectl diff against the live root: none).
# Rollback of the cut-over (Anders' break-glass, or with his go): turn Kargo's staging auto-promotion off and remove
# the root's kargo.akuity.io/authorized-stage annotation, then
#   kubectl --context r415 apply -f clusters/r415/root-legacy.yaml
# and ship again with platform-applications-gitops scripts/staging-release. Deleted in P7.1.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: teknoir-system
spec:
  sourceRepos:
    - '*'
  sourceNamespaces: []
  destinations:
    - namespace: 'teknoir-system'
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: 'argoproj.io'
      kind: 'AppProject'
    - group: 'argoproj.io'
      kind: 'Application'

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: teknoir-system
  annotations:
    teknoir.org/release: "staging-20261124.9"
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/app-of-apps
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: "bd11f03c9a5ca13a3ae3dc07c33bcc0d02f1c359"
    helm:
      parameters:
        - name: release
          value: "bd11f03c9a5ca13a3ae3dc07c33bcc0d02f1c359"
          forceString: true
        - name: releaseName
          value: "staging-20261124.9"
          forceString: true
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
