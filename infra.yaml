# Source: infra/charts/auth/templates/oauth2-proxy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: teknoir-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.teknoir.cloud/auth/realms/master
            - --client-id=teknoir
            - --login-url=https://auth.teknoir.cloud/auth/realms/master/protocol/openid-connect/auth
            - --redeem-url=https://auth.teknoir.cloud/auth/realms/master/protocol/openid-connect/token
            - --profile-url=https://auth.teknoir.cloud/auth/realms/master/protocol/openid-connect/userinfo
            - --cookie-domain=teknoir.cloud
            - --cookie-name=_teknoir_oauth2_proxy
            - --cookie-secure=true
            - --cookie-samesite=none
            - --cookie-path=/
            - --cookie-csrf-per-request=false
            - --cookie-csrf-expire=10m
            - --cookie-refresh=1m
            - --cookie-expire=12h
            - --email-domain=*
            - --redirect-url=https://teknoir.cloud/oauth2/callback
            - --oidc-extra-audience="master-realm"
            - --oidc-extra-audience="account"
            - --code-challenge-method=S256
            - --pass-access-token=true
            - --session-store-type=redis
            - --redis-connection-url=redis://oauth2-proxy-redis.teknoir-auth.svc.cluster.local:6379/0
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --upstream=static://200
            - --http-address=0.0.0.0:4180
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookie-secret
            - name: OAUTH2_PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-redis-secret
                  key: password
          ports:
            - name: http
              containerPort: 4180
---
# Source: infra/charts/auth/templates/keycloak-postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-db
  namespace: teknoir-auth
spec:
  serviceName: keycloak-db
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-db
  template:
    metadata:
      labels:
        app: keycloak-db
    spec:
      containers:
        - name: postgres
          image: docker.io/postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "keycloak"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-db-pvc
---
# Source: infra/charts/auth/templates/oauth2-proxy-redis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oauth2-proxy-redis
  namespace: teknoir-auth
spec:
  serviceName: oauth2-proxy-redis
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-redis
  template:
    metadata:
      labels:
        app: oauth2-proxy-redis
    spec:
      containers:
        - name: redis
          image: docker.io/redis:7.2-alpine
          command:
            - sh
            - -c
            - redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-redis-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oauth2-proxy-redis-pvc
