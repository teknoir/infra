# Source: infra/charts/auth/templates/istio-auth.yaml
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: oauth2-proxy-ext-authz
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_FIRST
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            transport_api_version: V3
            http_service:
              server_uri:
                uri: http://oauth2-proxy.teknoir-auth.svc.cluster.local:4180
                cluster: outbound|4180||oauth2-proxy.teknoir-auth.svc.cluster.local
                timeout: 10s
              path_prefix: "/oauth2/auth"
              authorization_request:
                allowed_headers:
                  patterns:
                    - exact: cookie
                    - exact: authorization
                    - exact: x-forwarded-proto
                    - exact: x-forwarded-host
                    - exact: x-forwarded-uri
              authorization_response:
                allowed_upstream_headers:
                  patterns:
                    - exact: x-forwarded-access-token
                    - exact: x-auth-request-access-token
                    - exact: x-auth-request-user
                    - exact: x-auth-request-email
                    - exact: x-auth-request-preferred-username
                allowed_client_headers:
                  patterns:
                    - exact: set-cookie
                    - exact: location
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              local function urlencode(str)
                if str == nil then
                  return ""
                end
                return string.gsub(str, "([^%w%-_%.~])", function(c)
                  return string.format("%%%02X", string.byte(c))
                end)
              end

              local function build_rd(h)
                local scheme = h:get("x-forwarded-proto") or "https"
                local host = h:get("x-forwarded-host") or h:get(":authority") or h:get("host") or ""
                local path = h:get("x-forwarded-uri") or h:get(":path") or "/"
                return scheme .. "://" .. host .. path, path
              end

              local function has_session_cookie(h)
                local cookie = h:get("cookie") or ""
                if cookie == "" then
                  return false
                end
                return string.find(cookie, "_teknoir_oauth2_proxy=") ~= nil
              end

              function envoy_on_request(handle)
                local h = handle:headers()
                local rd, path = build_rd(h)
                local md = handle:streamInfo():dynamicMetadata()
                md:set("oauth2_proxy", "rd", rd)
                md:set("oauth2_proxy", "path", path)
                md:set("oauth2_proxy", "has_session", has_session_cookie(h) and "true" or "false")
              end

              function envoy_on_response(handle)
                local status = handle:headers():get(":status")
                if status ~= "401" and status ~= "403" then
                  return
                end
                local md = handle:streamInfo():dynamicMetadata():get("oauth2_proxy") or {}
                local path = md["path"] or ""
                if string.sub(path, 1, 7) == "/oauth2" then
                  return
                end
                if md["has_session"] == "true" then
                  return
                end
                local rd = md["rd"] or ""
                if rd == "" then
                  rd, _ = build_rd(handle:headers())
                end
                local location = "https://teknoir.cloud/oauth2/start?rd=" .. urlencode(rd)
                handle:headers():replace(":status", "302")
                handle:headers():replace("location", location)
                handle:headers():replace("content-length", "0")
              end
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "istio-system/teknoir-gateway"
          vhost:
            name: "auth.teknoir.cloud:443"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "istio-system/teknoir-gateway"
          vhost:
            name: "harbor.teknoir.cloud:443"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
            envoy.filters.http.lua:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
              disabled: true
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "istio-system/teknoir-gateway"
          vhost:
            route:
              name: "oauth2-proxy-auth"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "istio-system/teknoir-gateway"
          vhost:
            route:
              name: "keycloak"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
            envoy.filters.http.lua:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
              disabled: true
