# Source: infra/charts/teknoir-gateway/templates/gateway.yaml
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: teknoir-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "teknoir.cloud"
    - "*.teknoir.cloud"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "teknoir.cloud"
    - "*.teknoir.cloud"
    tls:
      mode: SIMPLE
      credentialName: "teknoir-cloud-wildcard-tls"
---
# Source: infra/charts/teknoir-gateway/templates/gateway.yaml
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: teknoir-gateway-public
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway-public
  servers:
    - port:
        name: tls-mqtt
        number: 8883
        protocol: TLS
      hosts:
        - "teknoir.cloud"
        - "*.teknoir.cloud"
      tls:
        mode: PASSTHROUGH
    - port:
        name: https-mqtt
        number: 8084
        protocol: HTTPS
      hosts:
        - "teknoir.cloud"
        - "*.teknoir.cloud"
      tls:
        mode: SIMPLE
        credentialName: "teknoir-cloud-wildcard-tls"
    - port:
        name: tls-ssh
        number: 2222
        protocol: TLS
      hosts:
        - "teknoir.cloud"
        - "*.teknoir.cloud"
      tls:
        mode: PASSTHROUGH
---
# Source: infra/charts/auth/templates/keycloakx.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: keycloak
  namespace: kube-system
spec:
  repo: https://codecentric.github.io/helm-charts
  chart: keycloakx
  targetNamespace: teknoir-auth
  createNamespace: true
  takeOwnership: true
  valuesContent: |-
    fullnameOverride: keycloak
    image:
      repository: us-docker.pkg.dev/teknoir/gcr.io/keycloak-themed
      tag: "local-20260310-110746"
      pullPolicy: IfNotPresent
    service:
      name: keycloak-http
      httpPort: 80
    db:
      enabled: true
      name: keycloak-db
      port: 5432
      database: keycloak
      secretName: keycloak-db-secret
      #storage:
      #  size: 5Gi
      #  hostPath: /opt/teknoir/keycloak/pg
    command:
      - "/opt/keycloak/bin/kc.sh"
    args:
      - "start"
      - "--http-enabled=true"
      - "--http-port=8080"
      - "--hostname-strict=false"
    extraEnv: |
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: change-me
      - name: KC_HOSTNAME
        value: "auth.teknoir.cloud"
      - name: KC_HOSTNAME_URL
        value: "https://auth.teknoir.cloud"
      - name: KC_PROXY_HEADERS
        value: xforwarded
      - name: KC_HTTP_RELATIVE_PATH
        value: /auth
      - name: KC_DB
        value: postgres
      - name: KC_DB_URL_HOST
        value: keycloak-db
      - name: KC_DB_URL_PORT
        value: "5432"
      - name: KC_DB_URL_DATABASE
        value: keycloak
      - name: KC_DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-db-secret
            key: username
      - name: KC_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-db-secret
            key: password
