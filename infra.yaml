# Source: infra/charts/auth/templates/httpbin.yaml
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: httpbin-jwt
  namespace: teknoir-auth
spec:
  selector:
    matchLabels:
      app: httpbin
  jwtRules:
    - issuer: "https://auth.teknoir.cloud/auth/realms/master"
      jwksUri: "https://auth.teknoir.cloud/auth/realms/master/protocol/openid-connect/certs"
      outputPayloadToHeader: verified-jwt
      fromHeaders:
        - name: X-Forwarded-Access-Token
        - name: X-Auth-Request-Access-Token
---
