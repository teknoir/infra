# Source: infra/charts/harbor/templates/harbor.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: harbor
  namespace: kube-system
spec:
  repo: https://helm.goharbor.io
  chart: harbor
  targetNamespace: teknoir-system
  createNamespace: true
  takeOwnership: true
  valuesContent: |-
    core:
      existingSecret: harbor-secret
      existingXsrfSecret: harbor-secret
      existingXsrfSecretKey: CSRF_KEY
    database:
      internal:
        extrInitContainers:
        - command:
          - sh
          - -c
          - chown -R 999:999 /var/lib/postgresql/data
          image: busybox:latest
          name: fix-permissions
          securityContext:
            runAsUser: 0
          volumeMounts:
          - mountPath: /var/lib/postgresql/data
            name: database-data
    existingSecretAdminPassword: harbor-secret
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    existingSecretSecretKey: harbor-secret
    expose:
      tls:
        enabled: false
      type: none
    externalURL: ""
    fullnameOverride: harbor
    jobservice:
      existingSecret: harbor-secret
      existingSecretKey: JOBSERVICE_SECRET
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 10000:10000 /var/log/jobs
        image: busybox:latest
        name: fix-permissions
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/log/jobs
          name: job-logs
    persistence:
      enabled: true
      hostPathPrefix: /opt/teknoir/harbor
      persistentVolumeClaim:
        database:
          accessMode: ReadWriteOnce
          existingClaim: harbor-database-pvc
          size: 5Gi
          storageClass: ""
        jobservice:
          accessMode: ReadWriteOnce
          existingClaim: harbor-jobservice-pvc
          size: 1Gi
          storageClass: ""
        redis:
          accessMode: ReadWriteOnce
          existingClaim: harbor-redis-pvc
          size: 1Gi
          storageClass: ""
        registry:
          accessMode: ReadWriteOnce
          existingClaim: harbor-registry-pvc
          size: 500Gi
          storageClass: ""
        trivy:
          accessMode: ReadWriteOnce
          existingClaim: harbor-trivy-pvc
          size: 5Gi
          storageClass: ""
      resourcePolicy: keep
    redis:
      internal:
        initContainers:
        - command:
          - sh
          - -c
          - chown -R 999:999 /var/lib/redis
          image: busybox:latest
          name: fix-permissions
          securityContext:
            runAsUser: 0
          volumeMounts:
          - mountPath: /var/lib/redis
            name: data
    registry:
      existingSecret: harbor-secret
      existingSecretKey: REGISTRY_HTTP_SECRET
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 10000:10000 /storage
        image: busybox:latest
        name: fix-permissions
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /storage
          name: registry-data
    trivy:
      enabled: true
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 10000:10000 /home/scanner/.cache
        image: busybox:latest
        name: fix-permissions
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /home/scanner/.cache
          name: data
