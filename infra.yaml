# Source: infra/charts/harbor/templates/harbor-virtualservice.yaml
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: harbor
  namespace: teknoir-system
spec:
  hosts:
    - "harbor.teknoir.cloud"
  gateways:
    - istio-system/teknoir-gateway
  http:
    # Route API and Core requests directly to harbor-core
    - name: harbor-core
      match:
        - uri:
            prefix: /api/
        - uri:
            prefix: /c/
        - uri:
            prefix: /v2/
        - uri:
            prefix: /service/
      route:
        - destination:
            host: harbor-core.teknoir-system.svc.cluster.local
            port:
              number: 80

    # Route everything else (UI/static assets) to harbor-portal
    - name: harbor-portal
      route:
        - destination:
            host: harbor-portal.teknoir-system.svc.cluster.local
            port:
              number: 80
