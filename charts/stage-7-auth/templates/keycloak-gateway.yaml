apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - "auth.teknoir.online"
  gateways:
    - istio-system/teknoir-gateway
  http:
    - name: keycloak
      route:
        - destination:
            host: {{ .Values.keycloak.service.name | default (printf "%s-http" .Values.keycloak.fullnameOverride) }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.keycloak.service.httpPort }}

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: keycloak-db-allow
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: keycloak-db
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: keycloak-allow-ingress
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  action: ALLOW
  rules:
    - {}
{{/*    - from:*/}}
{{/*        - source:*/}}
{{/*            principals:*/}}
{{/*              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"*/}}
