# First install only (scripts/deploy-argo.sh). After that ArgoCD manages itself from the copy of this chart in
# platform-applications-gitops (teknoir-cloud, charts/argo, Application argo): change it there. Keep the two
# rendering the same objects, so a fresh install adopts without a change.

namespace: teknoir-system
domain: "teknoir.cloud"

# Istio integration configuration
istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system

argo-cd:
  namespaceOverride: "teknoir-system"

  # The delete protections of the gitops charts/argo (see there), so a fresh install renders exactly
  # what the Application argo adopts.
  crds:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false

  global:
    # -- Default domain used by all components
    ## Used for ingresses, certificates, SSO, notifications, etc.
    domain: argocd.teknoir.cloud


  configs:
    secret:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    cm:
      oidc.config: |
        name: Keycloak
        issuer: https://auth.teknoir.cloud/auth/realms/master
        clientID: argocd
        clientSecret: $argocd-oidc-secret:oidc.auth.clientSecret
        requestedScopes: ["openid", "profile", "email", "groups"]

    rbac:
      policy.default: role:readonly
      # Map the 'admin' group from Keycloak to ArgoCD admin role
      policy.csv: |
        g, admin, role:admin
        g, argocd-admins, role:admin
        p, role:admin, applications, delete, teknoir-cloud/argo, deny

  server:
    extraArgs:
      - --insecure

