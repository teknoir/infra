
namespace: teknoir-system
domain: "teknoir.airgapped"

# Istio integration configuration
istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system

argo-cd:
  namespaceOverride: "teknoir-system"

  # NOTE: The Teknoir Root CA is added to ArgoCD's TLS trust store
  # (configs.tls.certificates -> argocd-tls-certs-cm) at render time, keyed by the
  # Harbor host, so the repo-server can `helm registry login` to the in-cluster
  # Harbor OCI registry without "x509: certificate signed by unknown authority".
  # It is injected via `helm template --set-file` (scripts/deploy-argo.sh and
  # airgap/lib.sh:helm_template_chart) rather than hardcoded here, because
  # teknoir-root-ca.crt is generated per-deployment and gitignored.

  global:
    # -- Default domain used by all components
    ## Used for ingresses, certificates, SSO, notifications, etc.
    domain: argocd.teknoir.airgapped


  configs:
    cm:
      # NOTE: oidc.config (Keycloak SSO) is injected at render time from
      # charts/argo/files/oidc.config so the Teknoir Root CA can be embedded as
      # `rootCA`. argocd-server does OIDC discovery against Keycloak
      # (https://auth.teknoir.airgapped/.../.well-known/openid-configuration)
      # with its OWN TLS trust — it does NOT consult the node OS trust store nor
      # argocd-tls-certs-cm (that ConfigMap is repo-server-only, for Harbor OCI
      # login). Without rootCA the login fails with "x509: certificate signed by
      # unknown authority". It is injected via `helm template --set-file`
      # (scripts/deploy-argo.sh and airgap/lib.sh:helm_template_chart) rather
      # than hardcoded here, because teknoir-root-ca.crt is generated
      # per-deployment and gitignored.

      # Resource exclusions. ArgoCD will not discover/track/sync/prune these
      # kinds. This key REPLACES the argo-cd subchart's default list entirely,
      # so the full upstream default list is reproduced below plus the CRD entry.
      # CRDs (istio + cert-manager) are bootstrap-owned (K3s manifests dir) and
      # must never be managed/pruned by an ArgoCD Application.
      resource.exclusions: |
        ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
        - apiGroups:
          - ''
          - discovery.k8s.io
          kinds:
          - Endpoints
          - EndpointSlice
        ### Internal Kubernetes resources excluded reduce the number of watched events
        - apiGroups:
          - coordination.k8s.io
          kinds:
          - Lease
        ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
        - apiGroups:
          - authentication.k8s.io
          - authorization.k8s.io
          kinds:
          - SelfSubjectReview
          - TokenReview
          - LocalSubjectAccessReview
          - SelfSubjectAccessReview
          - SelfSubjectRulesReview
          - SubjectAccessReview
        ### Intermediate Certificate Request excluded reduce the number of watched events
        - apiGroups:
          - certificates.k8s.io
          kinds:
          - CertificateSigningRequest
        - apiGroups:
          - cert-manager.io
          kinds:
          - CertificateRequest
        ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
        - apiGroups:
          - cilium.io
          kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice
        ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
        - apiGroups:
          - kyverno.io
          - reports.kyverno.io
          - wgpolicyk8s.io
          kinds:
          - PolicyReport
          - ClusterPolicyReport
          - EphemeralReport
          - ClusterEphemeralReport
          - AdmissionReport
          - ClusterAdmissionReport
          - BackgroundScanReport
          - ClusterBackgroundScanReport
          - UpdateRequest
        ### CustomResourceDefinitions are bootstrap-owned and must never be ArgoCD-managed
        - apiGroups:
          - apiextensions.k8s.io
          kinds:
          - CustomResourceDefinition

    rbac:
      policy.default: role:readonly
      # Map the 'admin' group from Keycloak to ArgoCD admin role
      policy.csv: |
        g, admin, role:admin
        g, argocd-admins, role:admin

  server:
    extraArgs:
      - --insecure

  # Default redis image lives on public.ecr.aws, which is not mirrored by the
  # air-gapped Harbor (only docker.io/ghcr.io/gcr.io/quay.io/registry.k8s.io).
  # Pull it from docker.io so the containerd mirror rewrite applies.
  redis:
    image:
      repository: docker.io/library/redis

