# Default values for auth.
namespace: teknoir-auth

keycloak:
  enabled: true

oauth2Proxy:
  enabled: true
  secret:
    existingName: "oauth2-proxy-secret"
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.6.0
  oidc:
    issuerUrl: ""
    clientId: teknoir
  cookie:
    domain: ""
    name: _teknoir_oauth2_proxy
    sameSite: none
    path: /
    csrfPerRequest: false
    csrfExpire: 10m
    refresh: 1m
    expire: 12h
  redirectUrl: ""
  whitelistDomains: []
  authHosts: []
  sharedHost: ""
  emailDomains:
    - "*"
  provider: keycloak-oidc
  pkceMethod: S256
  extraAudiences:
    - master-realm
    - account
  allowedRoles: []
  allowedGroups: []
  passAccessToken: true
  sessionCookieMinimal: false
  reverseProxy: true
  redis:
    enabled: true
    host: oauth2-proxy-redis
    port: 6379
    database: 0
    secretName: oauth2-proxy-redis-secret
    passwordKey: password
    connectionUrlKey: connection-url
    storage:
      size: 1Gi
      hostPath: /opt/teknoir/oauth2-proxy/redis
  service:
    port: 4180

istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system
    selector:
      istio: ingressgateway
  auth:
    jwksIssuer: ""
    jwksUri: ""

httpbin:
  image:
    repository: docker.io/kennethreitz/httpbin
    tag: latest
  virtualService:
    hosts: []