{{- if .Values.keycloak.enabled -}}
{{- $domain := .Values.domain | default (index .Values "global" "domain") | default "teknoir.online" -}}
{{- $namespace := .Values.namespace | default .Release.Namespace -}}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: keycloak
  namespace: kube-system
spec:
  repo: https://codecentric.github.io/helm-charts
  chart: keycloakx
  targetNamespace: {{ $namespace }}
  createNamespace: true
  takeOwnership: true
  valuesContent: |-
    fullnameOverride: keycloak
    image:
      repository: us-docker.pkg.dev/teknoir/gcr.io/keycloak-themed
      tag: "local-20260310-110746"
      pullPolicy: IfNotPresent
    service:
      name: keycloak-http
      httpPort: 80
    db:
      enabled: true
      name: keycloak-db
      port: 5432
      database: keycloak
      secretName: keycloak-db-secret
      #storage:
      #  size: 5Gi
      #  hostPath: /opt/teknoir/keycloak/pg
    command:
      - "/opt/keycloak/bin/kc.sh"
    args:
      - "start"
      - "--http-enabled=true"
      - "--http-port=8080"
      - "--hostname-strict=false"
    extraEnv: |
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: change-me
      - name: KC_HOSTNAME
        value: "auth.{{ $domain }}"
      - name: KC_HOSTNAME_URL
        value: "https://auth.{{ $domain }}"
      - name: KC_PROXY_HEADERS
        value: xforwarded
      - name: KC_HTTP_RELATIVE_PATH
        value: /auth
      - name: KC_DB
        value: postgres
      - name: KC_DB_URL_HOST
        value: keycloak-db
      - name: KC_DB_URL_PORT
        value: "5432"
      - name: KC_DB_URL_DATABASE
        value: keycloak
      - name: KC_DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-db-secret
            key: username
      - name: KC_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-db-secret
            key: password
{{- end -}}
