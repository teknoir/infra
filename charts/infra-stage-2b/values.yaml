# Default values for infra-stage-2b.
istioNamespace: istio-system

istio-ingressgateway:
  name: istio-ingressgateway
  labels:
    istio: ingressgateway
  service:
    type: LoadBalancer

istio-egressgateway:
  name: istio-egressgateway
  labels:
    istio: egressgateway
  service:
    type: ClusterIP

gw:
  name: teknoir-gateway
  namespace: istio-system
  selector:
    istio: ingressgateway
  hosts:
    - "teknoir.online"
    - "*.teknoir.online"
  tls:
    credentialName: teknoir-online-wildcard-tls
