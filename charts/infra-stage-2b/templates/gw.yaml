apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.gw.name }}
  namespace: {{ .Values.gw.namespace }}
spec:
  selector:
{{- toYaml .Values.gw.selector | nindent 4 }}
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
{{- range .Values.gw.hosts }}
    - {{ . | quote }}
{{- end }}
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
{{- range .Values.gw.hosts }}
    - {{ . | quote }}
{{- end }}
    tls:
      mode: SIMPLE
      credentialName: {{ .Values.gw.tls.credentialName | quote }}
    - hosts:
{{- range .Values.gw.hosts }}
      - {{ . | quote }}
{{- end }}
      port:
        name: tcp-mqttssl
        number: 8883
        protocol: TCP
    - hosts:
{{- range .Values.gw.hosts }}
      - {{ . | quote }}
{{- end }}
      port:
        name: tcp-mqttwss
        number: 8084
        protocol: TCP
      - hosts:
{{- range .Values.gw.hosts }}
          - {{ . | quote }}
{{- end }}
        port:
          name: tcp-mqttwss
          number: 2222
          protocol: TCP