apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: harbor-allow-internal
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace | quote }}
