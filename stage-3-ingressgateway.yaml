---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: istio-ingressgateway
  namespace: kube-system
spec:
  repo: https://istio-release.storage.googleapis.com/charts
  chart: gateway
  targetNamespace: istio-system
  createNamespace: true
  takeOwnership: true
  valuesContent: |-
    name: istio-ingressgateway
    labels:
      istio: ingressgateway
    service:
      type: LoadBalancer
      ports:
        - name: status-port
          port: 15021
          protocol: TCP
          targetPort: 15021
        - name: http2
          port: 80
          protocol: TCP
          targetPort: 80
        - name: https
          port: 443
          protocol: TCP
          targetPort: 443    

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: istio-ingressgateway-public
  namespace: kube-system
spec:
  repo: https://istio-release.storage.googleapis.com/charts
  chart: gateway
  targetNamespace: istio-system
  createNamespace: true
  takeOwnership: true
  valuesContent: |-
    name: istio-ingressgateway-public
    labels:
      istio: ingressgateway-public
    service:
      type: LoadBalancer
      ports:
        - name: status-port
          port: 16021
          protocol: TCP
          targetPort: 15021   
        - name: tcp-ssh
          port: 2222
          targetPort: 2222
        - name: https-mqtt
          port: 8084
          targetPort: 8084
        - name: tls-mqtt
          port: 8883
          targetPort: 8883