apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-harbor-teknoir
  namespace: {{ .Release.Namespace }}
  labels:
    argocd.argoproj.io/secret-type: repository
data:
  {{- range $k, $v := .Values.repository }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
---
# an empty Secret (like argocd-secret) is never secret material
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: {{ .Release.Namespace }}
