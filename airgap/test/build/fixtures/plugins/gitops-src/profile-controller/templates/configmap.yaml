apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  ADMIN: {{ .Values.config.admin | quote }}
  DOMAIN: {{ .Values.config.domain | quote }}
  {{- with .Values.config.pluginChartRepo }}
  PLUGIN_CHART_REPO: {{ . | quote }}
  {{- end }}
  PLUGIN_CHART_VERSION: {{ .Values.config.pluginChartVersion | quote }}
