  namespace: teknoir-system
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
        app.kubernetes.io/part-of: argocd
    spec:
      containers:
        - name: server
          image: rancher/mirrored-pause:3.6
          resources:
            requests: {cpu: 1m, memory: 4Mi}
